import com.android.build.api.dsl.ManagedVirtualDevice
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
  alias(libs.plugins.android.test)
  alias(libs.plugins.androidx.baselineprofile)
}

android {
  namespace 'codes.chrishorner.reverserainbow.baselineprofile'
  compileSdk = project.property('app.compileSdk').toInteger()

  targetProjectPath = ':androidApp'

  defaultConfig {
    minSdk project.property('app.minSdk').toInteger()
    targetSdk project.property('app.targetSdk').toInteger()
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions.managedDevices.allDevices {
    pixel6Api35(ManagedVirtualDevice) {
      device = 'Pixel 6'
      apiLevel = 35
      systemImageSource = 'aosp'
    }
  }
}

kotlin {
  compilerOptions {
    jvmTarget.set(JvmTarget.JVM_17)
  }
}

baselineProfile {
  managedDevices += 'pixel6Api35'
  // Always generate against the emulator above.
  useConnectedDevices = false
}

dependencies {
  implementation project(':shared')
  implementation libs.androidx.benchmark.macro.junit4
  implementation libs.junit
}
